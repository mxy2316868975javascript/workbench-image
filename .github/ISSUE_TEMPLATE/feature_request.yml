name: 功能建议
description: 提出新功能、模板或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先说明使用场景，而不是只给实现方案。与「所有数据只存本机」这一核心约束冲突的需求通常不会被接受。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么任务时遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望界面或行为变成什么样？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 现在是怎么绕过去的？有没有其他项目可以参考？
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 示例图、上游模板链接、相关截图等。
